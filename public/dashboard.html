<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Moorecoin - Dashboard</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

    <!-- css -->
    <link rel="stylesheet" href="styles/shared.css" />
    <link rel="stylesheet" href="styles/dashboard.css" />
    <link rel="stylesheet" href="styles/google-button.css" />

    <!-- js -->
    <script type="module" src="scripts/dashboard.js"></script>
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebar-header">
        <img src="assets/favicon.svg" alt="Moorecoin" class="sidebar-logo" />
        <h1 id="moorecoin">Moorecoin</h1>
      </div>

      <ul>
        <li class="active"><a href="#dashboard">Dashboard</a></li>
        <li><a href="#account">Account</a></li>
        <li><a href="#ledger">Ledger</a></li>
        <li><a href="#settings">Settings</a></li>
      </ul>
      <span class="nav-indicator">←</span>

      <div class="sidebar-footer">
        <div class="user-info">
          <span class="user-info-name">Jane Doe</span>
          <span class="user-info-email">jane@brightonk12.com</span>
        </div>

        <button class="sidebar-toggle" aria-label="Toggle sidebar">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <line x1="9" y1="3" x2="9" y2="21" />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
