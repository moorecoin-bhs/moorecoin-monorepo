# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # There is no build step: public/ is hand-written static HTML, CSS
      # and ES modules that Firebase serves directly, and the only
      # package.json in the repo is api/'s (deployed separately). The
      # generated `npm ci && npm run build` here referenced a root
      # package.json that has never existed, so every run failed at this
      # step and nothing was ever deployed.
      - name: Check JavaScript syntax
        run: bash .github/scripts/check-syntax.sh
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOORECOIN }}
          projectId: moorecoin
